name: Build PyPad iOS IPA

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pypad-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache full Pyodide runtime
        uses: actions/cache@v4
        with:
          path: Web/vendor/pyodide
          key: pyodide-0.26.4-full-ios-v1

      - name: Vendor editor libraries
        shell: bash
        run: bash scripts/vendor.sh

      - name: Vendor and verify full Python runtime
        shell: bash
        run: bash scripts/vendor-pyodide.sh

      - name: Run source and IDE regression checks
        shell: bash
        run: bash scripts/check-source.sh

      - name: Smoke-test bundled Python runtime
        shell: bash
        run: node scripts/smoke-python.mjs

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project PyPad.xcodeproj \
            -scheme PyPad \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/PyPad.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 100

      - name: Verify app embeds Python
        shell: bash
        run: |
          set -euo pipefail
          APP="build/PyPad.xcarchive/Products/Applications/PyPad.app"
          RUNTIME="$APP/Web/vendor/pyodide"
          test -d "$APP"
          test -s "$APP/Info.plist"
          for file in pyodide.js pyodide.mjs pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            test -s "$RUNTIME/$file" || { echo "Missing bundled Python file: $file"; exit 1; }
          done
          SIZE_KB="$(du -sk "$RUNTIME" | awk '{print $1}')"
          test "$SIZE_KB" -gt 100000
          find "$RUNTIME" -maxdepth 1 -type f -name '*.whl' -print -quit | grep -q .
          echo "Embedded Python size: $(du -sh "$RUNTIME" | cut -f1)"

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/PyPad.xcarchive/Products/Applications/PyPad.app"
          rm -rf Payload PyPad.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry PyPad.ipa Payload
          /usr/bin/zip -T PyPad.ipa
          unzip -Z1 PyPad.ipa > "$RUNNER_TEMP/ipa-files.txt"
          grep -Fq 'Payload/PyPad.app/Web/vendor/pyodide/pyodide.mjs' "$RUNNER_TEMP/ipa-files.txt"
          grep -Fq 'Payload/PyPad.app/Web/vendor/pyodide/pyodide.asm.wasm' "$RUNNER_TEMP/ipa-files.txt"
          grep -Fq 'Payload/PyPad.app/Web/vendor/pyodide/pyodide-lock.json' "$RUNNER_TEMP/ipa-files.txt"
          test -s PyPad.ipa
          ls -lh PyPad.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PyPad-unsigned-ipa
          path: PyPad.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to version release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PyPad.ipa
          fail_on_unmatched_files: true
