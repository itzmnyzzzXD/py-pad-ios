<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<title>PyPad</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  </defs>
</svg>

<div id="app" data-view="code" data-sb="closed" data-out="show">

  <header id="top">
    <button class="ib" id="btnMenu" title="Files (⌘B)"><svg class="i"><use href="#i-menu"/></svg></button>
    <div class="brand"><span class="logo">&gt;_</span><span class="bname">PyPad</span></div>
    <div class="spacer"></div>
    <button class="ib" id="btnPanel" title="Toggle output (⌘J)"><svg class="i"><use href="#i-panel"/></svg></button>
    <button class="ib" id="btnSettings" title="Settings (⌘,)"><svg class="i"><use href="#i-sliders"/></svg></button>
    <button class="run" id="btnRun" title="Run (⌘↵)"><svg class="i"><use href="#i-play"/></svg><span>Run</span></button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="sb-tabs" id="sbTabs">
        <button data-sb="files" class="on">Files</button>
        <button data-sb="pkgs">Packages</button>
        <button data-sb="tpl">Templates</button>
      </div>
      <div class="sb-body" id="sbBody"></div>
    </aside>
    <div id="scrim"></div>

    <section id="work">
      <div id="tabs"></div>
      <div id="split">
        <div id="editorPane">
          <div id="editor"></div>
          <div id="xkeys"></div>
        </div>
        <div id="gutter"></div>
        <div id="outPane">
          <div id="outTabs">
            <button data-out="term" class="on"><svg class="i"><use href="#i-terminal"/></svg><span>Terminal</span></button>
            <button data-out="prev"><svg class="i"><use href="#i-eye"/></svg><span>Preview</span></button>
            <button data-out="disc"><svg class="i"><use href="#i-chat"/></svg><span>Discord</span></button>
            <div class="spacer"></div>
            <button class="ib sm" id="btnClear" title="Clear (⌘K)"><svg class="i"><use href="#i-trash"/></svg></button>
          </div>
          <div id="outBody">
            <div class="panel on" id="p-term">
              <div id="termOut"></div>
              <form id="termForm" autocomplete="off">
                <button type="button" id="termMode" title="Switch Python / Shell">&gt;&gt;&gt;</button>
                <input id="termIn" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Python REPL — try 1+1, or  pip install rich">
              </form>
            </div>
            <div class="panel" id="p-prev">
              <div class="urlbar">
                <button class="ib sm" id="pvReload"><svg class="i"><use href="#i-refresh"/></svg></button>
                <div id="pvUrl">nothing running</div>
              </div>
              <iframe id="pvFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads"></iframe>
              <div id="pvEmpty" class="empty"><b>No preview yet</b><span>Run an .html file, or run a Flask app (<code>app.run()</code>).</span></div>
            </div>
            <div class="panel" id="p-disc">
              <div class="dc-head">
                <div><b id="dcTitle">Discord simulator</b><small id="dcSub">Run a bot with <code>bot.run(TOKEN)</code></small></div>
                <select id="dcChan"><option>#general</option><option>#bot-commands</option></select>
              </div>
              <div id="dcMsgs"></div>
              <form id="dcForm" autocomplete="off">
                <input id="dcIn" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Message #general — try !ping or /hello">
                <button class="run sm" type="submit">Send</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <nav id="bnav">
    <button data-view="files" class="on"><svg class="i"><use href="#i-folder"/></svg><span>Files</span></button>
    <button data-view="code"><svg class="i"><use href="#i-code"/></svg><span>Code</span></button>
    <button data-view="out"><svg class="i"><use href="#i-terminal"/></svg><span>Output</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/templates.js"></script>
<script src="js/editor.js"></script>
<script src="js/python.js"></script>
<script src="js/runners.js"></script>
<script src="js/shell.js"></script>
<script src="js/ui.js"></script>
<script src="js/cursor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
